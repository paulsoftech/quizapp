<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: tomato;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .quiz-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 80%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .question {
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .answers {
            list-style: none;
            padding: 0;
        }

        .answers li {
            margin-bottom: 10px;
        }

        .answer-btn {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: left;
            cursor: pointer;
            background-color: #eee;
            transition: background-color 0.3s ease;
        }

        .answer-btn:hover {
            background-color: #ddd;
        }

        .next-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
        }

        .next-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .result {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
            width: 100%;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .quiz-container {
                width: 95%;
                padding: 15px;
            }

            .question {
                font-size: 1.1em;
            }

            .answer-btn {
                padding: 8px;
                font-size: 0.95em;
            }

            .next-btn {
                font-size: 0.95em;
            }

            .result {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="question" id="question"></div>
        <ul class="answers" id="answers"></ul>
        <button id="next-btn" class="next-btn">Next</button>
        <div class="result" id="result" style="display: none;"></div>
    </div>
    <footer>
        <p>&copy; 2025 Built with love by Paul Adekanye</p>
    </footer>

    <script>
        const questions = [
            {
                question: "What is the capital of Nigeria?",
                answers: [
                    { text: "Lagos", correct: false },
                    { text: "Abuja", correct: true },
                    { text: "Kano", correct: false },
                    { text: "Port Harcourt", correct: false }
                ]
            },
            {
                question: "Which planet is known as the 'Red Planet'?",
                answers: [
                    { text: "Mars", correct: true },
                    { text: "Jupiter", correct: false },
                    { text: "Venus", correct: false },
                    { text: "Saturn", correct: false }
                ]
            },
            {
                question: "Which team is the current premier league champions?",
                answers: [
                    { text: "Man Utd", correct: false },
                    { text: "Wolvesburg", correct: false },
                    { text: "Liverpool", correct: true },
                    { text: "Bolton", correct: false }
                ]
            }
            
            // Add more questions here
        ];

        const questionElement = document.getElementById("question");
        const answersElement = document.getElementById("answers");
        const nextButton = document.getElementById("next-btn");
        const resultElement = document.getElementById("result");

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = []; // To track user's choices (optional, for more advanced features)

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            nextButton.innerText = "Next";
            showQuestion();
        }

        function showQuestion() {
            resetState();
            let currentQuestion = questions[currentQuestionIndex];
            let questionNo = currentQuestionIndex + 1;
            questionElement.innerText = questionNo + ". " + currentQuestion.question;

            currentQuestion.answers.forEach(answer => {
                const button = document.createElement("button");
                button.innerText = answer.text;
                button.classList.add("answer-btn");
                if (answer.correct) {
                    button.dataset.correct = "true";
                }
                button.addEventListener("click", selectAnswer);
                answersElement.appendChild(button);
            });
        }

        function resetState() {
            while (answersElement.firstChild) {
                answersElement.removeChild(answersElement.firstChild);
            }
            resultElement.style.display = "none";
            nextButton.style.display = "block";
            nextButton.disabled = true; // Disable until an answer is selected
        }

        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === "true";

            if (isCorrect) {
                score++;
                selectedBtn.style.backgroundColor = "#4CAF50"; // Green for correct
            } else {
                selectedBtn.style.backgroundColor = "#f44336"; // Red for incorrect
            }

            Array.from(answersElement.children).forEach(button => {
                if (button.dataset.correct === "true") {
                    button.style.backgroundColor = "#4CAF50"; // Highlight correct answer
                }
                button.disabled = true; // Disable all buttons after selection
            });

            nextButton.disabled = false;
        }

        function showResult() {
            resetState();
            questionElement.innerText = `You scored ${score} out of ${questions.length}!`;
            nextButton.innerText = "Play Again";
            nextButton.style.display = "block";
            nextButton.addEventListener("click", startQuiz);
        }

        function handleNextButton() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        nextButton.addEventListener("click", handleNextButton);

        // Start the quiz when the page loads
        startQuiz();
    </script>
</body>
</html>
